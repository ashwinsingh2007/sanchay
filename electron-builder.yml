appId: app.sanchay.desktop
productName: Sanchay
directories:
  buildResources: resources
files:
  - out/**
  - package.json
asarUnpack:
  - '**/*.node'
mac:
  category: public.app-category.finance
  target:
    - target: dmg
      arch: [arm64]
  # `npm run release:mac` signs with the Developer ID certificate in the login Keychain and
  # notarizes with the `sanchay-notarize` notarytool profile. `npm run dist` builds unsigned.
  identity: 'Ashwani Kumar (4WQCFVKX78)'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: Lets you talk to Sanchay. Audio is transcribed on this Mac.
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: true
